# Rust for blockwright — the worked example from docs/languages.md.
#
#     pip install tree-sitter-rust
#     python -m blockwright --lang-dir docs/example-rust --lang rust docs/example-rust
#
# Not built in: the grammar is not bundled. Copy this folder anywhere and
# pass it with --lang-dir (or list it in BLOCKWRIGHT_LANGS).

name = "rust"
title = "Rust"
grammar = "tree_sitter_rust"
package = "tree-sitter-rust"
extensions = [".rs"]
separators = ["::", "."]
skip = ["line_comment", "block_comment"]
# println! and friends need code: their arguments are raw tokens
hooks = "rust_hooks.py"

[functions]
nodes = ["function_item"]
names = ["identifier"]
parameter_nodes = ["parameter"]
scopes = ["impl_item", "mod_item", "trait_item"]
entry = ["main"]

[statements]
block = "block"
expression_statement = "expression"
let_declaration = "simple"
# `if`, `while`, `match` are expressions; expression_statement passes them on
if_expression = { kind = "if", condition = "condition", then = "consequence", else = "alternative" }
else_clause = "block"
while_expression = { kind = "while", condition = "condition", body = "body" }
loop_expression = { kind = "while", body = "body" }
# a hook first: `for i in a..=b` becomes a counting loop, anything else a foreach
for_expression = { hook = "range_for", kind = "foreach", var = "pattern", iterable = "value", body = "body" }
match_expression = { kind = "switch", value = "value", body = "body", default_labels = ["_"], cases = { match_arm = { labels = ["match_pattern"], body = "value" } } }
break_expression = "break"
continue_expression = "continue"
return_expression = "return"
macro_invocation = { hook = "macro" }

[calls]
nodes = { call_expression = "arguments" }
callee = "function"

[strings]
nodes = ["string_literal", "raw_string_literal", "char_literal"]
