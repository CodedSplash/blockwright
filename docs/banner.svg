    <rect x="-42" y="142" width="88" height="32" rx="4" fill="#0f2430" stroke="#a7f3d0"/>
    <rect x="114" y="142" width="88" height="32" rx="4" fill="#0f2430" stroke="#a7f3d0"/>
  </g>

  <!-- название -->
  <text x="372" y="116" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="62" font-weight="700" fill="#f8fafc" letter-spacing="-1">
    block<tspan fill="url(#accent)">wright</tspan>
  </text>
  <text x="375" y="158" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="21" fill="#94a3b8">
    Flowcharts from C / C++ source code
