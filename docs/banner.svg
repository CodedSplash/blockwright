<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101822"/>
      <stop offset="0.55" stop-color="#16202c"/>
      <stop offset="1" stop-color="#1b2836"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="22" fill="url(#bg)"/>
  <circle cx="150" cy="130" r="95" fill="#38bdf8" opacity="0.10" filter="url(#soft)"/>
  <circle cx="880" cy="60" r="70" fill="#34d399" opacity="0.08" filter="url(#soft)"/>

  <!-- мини-схема слева -->
  <g transform="translate(92,52)" stroke="#7dd3fc" stroke-width="2.4" fill="none"
