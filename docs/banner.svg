    <rect x="34" y="0" width="92" height="34" rx="17" fill="#0f2430"/>
    <path d="M80 34 L80 56"/>
    <path d="M74 50 L80 58 L86 50 Z" fill="#7dd3fc" stroke="none"/>
    <polygon points="80,58 134,90 80,122 26,90" fill="#132b34"/>
    <path d="M26 90 L2 90 L2 140"/>
    <path d="M-4 134 L2 142 L8 134 Z" fill="#7dd3fc" stroke="none"/>
    <path d="M134 90 L158 90 L158 140"/>
