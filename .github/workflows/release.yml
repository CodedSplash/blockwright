name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the binaries to (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            built: dist/blockwright.exe
            asset: blockwright-windows-x64.exe
          # 22.04 keeps the glibc requirement low, so the binary also runs
          # on older distributions
          - os: ubuntu-22.04
            label: Linux x86-64
            built: dist/blockwright
            asset: blockwright-linux-x86_64
          # бесплатные ARM-раннеры для публичных репозиториев;
          # этот же файл годится для Raspberry Pi и для proot-distro на Android
          - os: ubuntu-22.04-arm
            label: Linux ARM64
            built: dist/blockwright
            asset: blockwright-linux-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          # для платформ, которых нет в vendor/ (например ARM64)
          python -m pip install -r requirements.txt

      - name: Build a single file
        run: python build.py

      - name: Smoke test the binary
        shell: bash
        run: |
          "${{ matrix.built }}" examples -o smoke --no-ui
          test -f smoke/index.html
          test -f smoke/grades__main.svg
          grep -q "AVOID_WASM" smoke/index.html
          echo "binary works: $("${{ matrix.built }}" --version)"

      - name: Name the asset
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -la assets
          gh release upload "$TAG" assets/* --clobber \
            --repo "${{ github.repository }}"
