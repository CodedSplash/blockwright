# C#. Top-level statements (C# 9) become a chart of their own.

name = "csharp"
title = "C#"
grammar = "tree_sitter_c_sharp"
package = "tree-sitter-c-sharp"
extensions = [".cs"]
separators = ["."]
skip = ["comment"]

[functions]
nodes = ["method_declaration", "constructor_declaration", "local_function_statement",
         "operator_declaration"]
names = ["identifier"]
parameter_nodes = ["parameter"]
scopes = ["class_declaration", "struct_declaration", "interface_declaration",
          "record_declaration", "namespace_declaration", "file_scoped_namespace_declaration"]
entry = ["Main"]
nested = true

[program]
node = "compilation_unit"
skip = ["using_directive", "namespace_declaration", "file_scoped_namespace_declaration",
        "class_declaration", "struct_declaration", "interface_declaration",
        "enum_declaration", "record_declaration", "delegate_declaration",
        "extern_alias_directive", "attribute_list"]

[statements]
global_statement = "block"
block = "block"
expression_statement = "expression"
local_declaration_statement = "simple"
local_function_statement = "skip"
if_statement = { kind = "if", condition = "condition", then = "consequence", else = "alternative" }
while_statement = { kind = "while", condition = "condition", body = "body" }
do_statement = { kind = "do", condition = "condition", body = "body" }
for_statement = { kind = "for", init = "initializer", condition = "condition", update = "update", body = "body" }
foreach_statement = { kind = "foreach", var = "left", iterable = "right", body = "body" }
# sections must end in break/return/throw; empty ones share the next body
switch_statement = { kind = "switch", value = "value", body = "body", fallthrough = true, cases = { switch_section = { labels = ["constant_pattern", "declaration_pattern", "relational_pattern", "type_pattern", "recursive_pattern", "or_pattern", "and_pattern", "not_pattern", "var_pattern", "list_pattern", "parenthesized_pattern", "discard", "when_clause"] } } }
break_statement = "break"
continue_statement = "continue"
return_statement = "return"
throw_statement = "throw"
yield_statement = "return"
# an expression-bodied method: `int Sq(int x) => x * x;`
arrow_expression_clause = "return"
goto_statement = { kind = "goto", label = "#0" }
labeled_statement = { kind = "label", label = "#0" }
try_statement = { kind = "try", body = "body", handlers = { catch_clause = { parameter = "catch_declaration" } }, finally = "finally_clause" }
using_statement = { kind = "inline", body = "body" }
lock_statement = { kind = "inline", body = "body" }
fixed_statement = { kind = "inline", body = "body" }
checked_statement = "block"
unsafe_statement = "block"

[calls]
nodes = { invocation_expression = "arguments" }
callee = "function"

[io]
unwrap_args = ["argument"]
assign = { variable_declarator = ["name", "#0"], assignment_expression = ["left", "right"] }

[io.output]
# Console.WriteLine("{0} + {1}", a, b) fills the placeholders
"Console.WriteLine" = { format = 0, style = "composite", weave = ":" }
"Console.Write" = { format = 0, style = "composite", weave = ":" }
"Console.Error.WriteLine" = { format = 0, style = "composite", weave = ":" }

[io.input]
"Console.ReadLine" = { args = ":0" }
"Console.Read" = { args = ":0" }
"Console.ReadKey" = { args = ":0" }

[strings]
nodes = ["string_literal", "verbatim_string_literal", "raw_string_literal",
         "interpolated_string_expression", "character_literal"]
concat_operator = "+"
