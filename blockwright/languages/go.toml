# Go. `for` is one statement with four shapes; the variants below pick by
# the clause inside it.

name = "go"
title = "Go"
grammar = "tree_sitter_go"
package = "tree-sitter-go"
extensions = [".go"]
separators = ["."]
statement_end = ""
skip = ["comment"]

[functions]
nodes = ["function_declaration", "method_declaration"]
names = ["identifier", "field_identifier"]
parameter_nodes = ["parameter_declaration", "variadic_parameter_declaration"]
entry = ["main"]

[statements]
block = "block"
statement_list = "block"
expression_statement = "expression"
var_declaration = "simple"
short_var_declaration = "simple"
assignment_statement = "simple"
if_statement = { kind = "if", init = "initializer", condition = "condition", then = "consequence", else = "alternative" }
for_statement = [
  { when = "for_clause", kind = "for", init = "for_clause.initializer", condition = "for_clause.condition", update = "for_clause.update", body = "body" },
  { when = "range_clause", kind = "foreach", var = "range_clause.left", iterable = "range_clause.right", body = "body" },
  # `for cond { }` and `for { }`
  { kind = "while", condition = "#0", body = "body" },
]
# no implicit fallthrough: only an explicit `fallthrough` statement;
# `switch { case x > 0: … }` without a value is a chain of conditions
expression_switch_statement = { kind = "switch", value = "value", fallthrough = "fallthrough_statement", cases = { expression_case = { value = "value" }, default_case = { default = true } } }
type_switch_statement = { kind = "switch", value = "value", cases = { type_case = { value = "type" }, default_case = { default = true } } }
fallthrough_statement = "skip"
break_statement = "break"
continue_statement = "continue"
return_statement = "return"
goto_statement = { kind = "goto", label = "label" }
labeled_statement = { kind = "label", label = "label" }

[calls]
nodes = { call_expression = "arguments" }
callee = "function"

[io]
input_strip = "&"
printf_conversions = "vTtqxXobeEfFgGscdUp"
assign = { short_var_declaration = ["left", "right"], assignment_statement = ["left", "right"] }

[io.output]
"fmt.Println" = { weave = ":", sep = " " }
"fmt.Print" = { weave = ":" }
"fmt.Printf" = { format = 0 }
"fmt.Fprintln" = { weave = "1:", sep = " ", args = "1:" }
"fmt.Fprint" = { weave = "1:", args = "1:" }
"fmt.Fprintf" = { format = 1, args = "1:" }
println = { weave = ":", sep = " " }
print = { weave = ":" }

[io.input]
"fmt.Scan" = {}
"fmt.Scanln" = {}
"fmt.Scanf" = { args = "1:" }
"fmt.Fscan" = { args = "1:" }
"fmt.Fscanln" = { args = "1:" }
"fmt.Fscanf" = { args = "2:" }
ReadString = { args = ":0" }
ReadLine = { args = ":0" }
Scan = { args = ":0" }

[strings]
nodes = ["interpreted_string_literal", "raw_string_literal", "rune_literal"]
concat_operator = "+"
