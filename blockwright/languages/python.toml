# Python. Code outside functions becomes a chart of its own (see [program]).

name = "python"
title = "Python"
grammar = "tree_sitter_python"
package = "tree-sitter-python"
extensions = [".py", ".pyw"]
markers = ["def ", "import ", "print(", "elif "]
separators = ["."]
statement_end = ""
skip = ["comment"]

[functions]
nodes = ["function_definition"]
names = ["identifier"]
ignore_parameters = ["self", "cls"]
scopes = ["class_definition"]
entry = ["main"]
# a function inside a function gets a chart of its own
nested = true

[program]
node = "module"
skip = ["function_definition", "class_definition", "decorated_definition",
        "import_statement", "import_from_statement", "future_import_statement"]

[statements]
block = "block"
# a lone string is a docstring
expression_statement = { kind = "expression", skip = ["string"] }
pass_statement = "skip"
function_definition = "skip"
class_definition = "skip"
decorated_definition = "skip"
if_statement = { kind = "if", condition = "condition", then = "consequence", else = "alternative", elif = ["elif_clause"] }
else_clause = "block"
while_statement = { kind = "while", condition = "condition", body = "body", else = "alternative" }
# `for i in range(a, b)` is drawn as a counting loop
for_statement = { kind = "foreach", var = "left", iterable = "right", body = "body", else = "alternative", range = ["range"] }
match_statement = { kind = "switch", value = "subject", body = "body", default_labels = ["_"], cases = { case_clause = { labels = ["case_pattern"], body = "consequence" } } }
break_statement = "break"
continue_statement = "continue"
return_statement = "return"
raise_statement = "throw"
try_statement = { kind = "try", body = "body", handlers = { except_clause = { parameter = "value", body = "block" }, except_group_clause = { parameter = "#0", body = "block" } }, else = ["else_clause"], finally = ["finally_clause"] }
with_statement = { kind = "inline", body = "body" }

[calls]
nodes = { call = "arguments" }
callee = "function"

[io]
skip_args = ["keyword_argument", "comment"]
# `n = int(input())` is input of n
assign = { assignment = ["left", "right"] }

[io.output]
print = { weave = ":", sep = " " }
"sys.stdout.write" = { weave = ":" }

[io.input]
input = { args = ":0" }
"sys.stdin.readline" = { args = ":0" }
"sys.stdin.read" = { args = ":0" }

[strings]
nodes = ["string"]
concat = ["concatenated_string"]
concat_operator = "+"
# "%d of %d" % (i, n)
format_operator = "%"
format_tuples = ["tuple", "parenthesized_expression"]
