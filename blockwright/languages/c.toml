# C. This file doubles as the reference for the description format:
# docs/languages.md explains every key.

name = "c"
title = "C"
grammar = "tree_sitter_c"
package = "tree-sitter-c"
extensions = [".c", ".h"]
# .h is shared with C++: without C++ markers in the text it is C
priority = 1
# a file that fails to parse as C is tried as C++
retry = ["cpp"]
separators = ["::"]
strip = ['\bstd\s*::\s*']
skip = ["comment", "preproc_call"]

[functions]
nodes = ["function_definition"]
# prototypes: only their names are collected, to recognise calls
declarations = ["declaration", "field_declaration"]
# a declaration is a function when its declarator chain has one of these
requires = "function_declarator"
name = ""
names = ["identifier", "field_identifier", "type_identifier", "qualified_identifier"]
parameter_nodes = ["parameter_declaration", "optional_parameter_declaration",
                   "variadic_parameter_declaration"]
ignore_parameters = ["void"]
entry = ["main"]
ok_exit = ["0", "EXIT_SUCCESS"]

[statements]
compound_statement = "block"
expression_statement = "expression"
declaration = "simple"
if_statement = { kind = "if", condition = "condition", then = "consequence", else = "alternative" }
else_clause = "block"
while_statement = { kind = "while", condition = "condition", body = "body" }
do_statement = { kind = "do", condition = "condition", body = "body" }
for_statement = { kind = "for", init = "initializer", condition = "condition", update = "update", body = "body" }
switch_statement = { kind = "switch", value = "condition", body = "body", fallthrough = true, cases = { case_statement = { value = "value" } } }
break_statement = "break"
continue_statement = "continue"
return_statement = "return"
goto_statement = { kind = "goto", label = "label" }
labeled_statement = { kind = "label", label = "label" }

[calls]
nodes = { call_expression = "arguments" }
callee = "function"
# `obj.f()` is not a call of a user function, `f()` and `ns::f()` are
callee_types = ["identifier", "qualified_identifier"]

[io]
input_strip = "&"

[io.output]
printf = { format = 0 }
printf_s = { format = 0 }
wprintf = { format = 0 }
vprintf = { format = 0 }
fprintf = { format = 1, args = "1:" }
puts = { weave = ":1" }
fputs = { weave = ":1", args = ":1" }
putchar = { weave = ":1" }
putc = { weave = ":1", args = "1:" }

[io.input]
scanf = { args = "1:" }
scanf_s = { args = "1:" }
wscanf = { args = "1:" }
fscanf = { args = "2:" }
sscanf = { args = "2:" }
gets = {}
gets_s = {}
fgets = {}
getchar = {}
getc = {}

[strings]
nodes = ["string_literal", "char_literal"]
concat = ["concatenated_string"]
