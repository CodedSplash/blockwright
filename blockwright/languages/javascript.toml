# JavaScript. Top-level code of a script becomes a chart of its own.
# Functions stored in variables (`const f = () => …`) are not charted.

name = "javascript"
title = "JavaScript"
grammar = "tree_sitter_javascript"
package = "tree-sitter-javascript"
extensions = [".js", ".mjs", ".cjs", ".jsx"]
separators = ["."]
skip = ["comment"]
empty = ["empty_statement"]

[functions]
nodes = ["function_declaration", "generator_function_declaration", "method_definition"]
names = ["identifier", "property_identifier"]
scopes = ["class_declaration"]
entry = ["main"]
nested = true

[program]
node = "program"
skip = ["function_declaration", "generator_function_declaration", "class_declaration",
        "import_statement", "export_statement", "hash_bang_line"]

[statements]
statement_block = "block"
expression_statement = "expression"
lexical_declaration = "simple"
variable_declaration = "simple"
empty_statement = "skip"
function_declaration = "skip"
generator_function_declaration = "skip"
class_declaration = "skip"
if_statement = { kind = "if", condition = "condition", then = "consequence", else = "alternative" }
else_clause = "block"
while_statement = { kind = "while", condition = "condition", body = "body" }
do_statement = { kind = "do", condition = "condition", body = "body" }
for_statement = { kind = "for", init = "initializer", condition = "condition", update = "increment", body = "body" }
for_in_statement = { kind = "foreach", var = "left", iterable = "right", body = "body" }
switch_statement = { kind = "switch", value = "value", body = "body", fallthrough = true, cases = { switch_case = { value = "value", body = "body" }, switch_default = { default = true, body = "body" } } }
break_statement = "break"
continue_statement = "continue"
return_statement = "return"
throw_statement = "throw"
labeled_statement = { kind = "block", skip = ["statement_identifier"] }
try_statement = { kind = "try", body = "body", handlers = { catch_clause = { parameter = "parameter" } }, finally = "finalizer" }

[calls]
nodes = { call_expression = "arguments" }
callee = "function"

[io]
assign = { variable_declarator = ["name", "value"], assignment_expression = ["left", "right"] }

[io.output]
"console.log" = { weave = ":", sep = " " }
"console.info" = { weave = ":", sep = " " }
"console.warn" = { weave = ":", sep = " " }
"console.error" = { weave = ":", sep = " " }
"process.stdout.write" = { weave = ":" }
"document.write" = { weave = ":" }
alert = { weave = ":" }

[io.input]
prompt = { args = ":0" }

[strings]
nodes = ["string", "template_string"]
template = "${"
concat_operator = "+"
