# Java.

name = "java"
title = "Java"
grammar = "tree_sitter_java"
package = "tree-sitter-java"
extensions = [".java"]
separators = ["."]
skip = ["line_comment", "block_comment"]

[functions]
nodes = ["method_declaration", "constructor_declaration", "compact_constructor_declaration"]
names = ["identifier"]
parameter_nodes = ["formal_parameter", "spread_parameter"]
scopes = ["class_declaration", "interface_declaration", "enum_declaration", "record_declaration"]
entry = ["main"]

[statements]
block = "block"
expression_statement = "expression"
local_variable_declaration = "simple"
if_statement = { kind = "if", condition = "condition", then = "consequence", else = "alternative" }
while_statement = { kind = "while", condition = "condition", body = "body" }
do_statement = { kind = "do", condition = "condition", body = "body" }
for_statement = { kind = "for", init = "init", condition = "condition", update = "update", body = "body" }
enhanced_for_statement = { kind = "foreach", var = "name", iterable = "value", body = "body" }
# `case 1:` groups fall through, `case 1 ->` rules do not
switch_expression = { kind = "switch", value = "condition", body = "body", fallthrough = true, cases = { switch_block_statement_group = { labels = ["switch_label"] }, switch_rule = { labels = ["switch_label"], fallthrough = false } } }
break_statement = "break"
continue_statement = "continue"
return_statement = "return"
throw_statement = "throw"
yield_statement = "return"
# `outer: for (…)` labels a loop for `break outer`; the loop is what matters
labeled_statement = { kind = "block", skip = ["identifier"] }
try_statement = { kind = "try", body = "body", handlers = { catch_clause = { parameter = "catch_formal_parameter" } }, finally = "finally_clause" }
try_with_resources_statement = { kind = "try", body = "body", handlers = { catch_clause = { parameter = "catch_formal_parameter" } }, finally = "finally_clause" }
synchronized_statement = { kind = "inline", body = "body" }
local_class_declaration = "skip"
class_declaration = "skip"

[calls]
nodes = { method_invocation = "arguments" }

[io]
# `int n = sc.nextInt();` is input of n
assign = { variable_declarator = ["name", "value"], assignment_expression = ["left", "right"] }
# %n is a line break in Java, not a conversion that takes an argument
printf_conversions = "bBhHsScCdoxXeEfgGaAtT"
format_replace = { "%n" = " " }

[io.output]
"System.out.println" = { weave = ":" }
"System.out.print" = { weave = ":" }
"System.out.printf" = { format = 0 }
"System.out.format" = { format = 0 }
"System.err.println" = { weave = ":" }
"System.err.print" = { weave = ":" }
"System.err.printf" = { format = 0 }

[io.input]
nextInt = { args = ":0" }
nextLong = { args = ":0" }
nextDouble = { args = ":0" }
nextFloat = { args = ":0" }
nextBoolean = { args = ":0" }
nextShort = { args = ":0" }
nextByte = { args = ":0" }
nextLine = { args = ":0" }
nextBigInteger = { args = ":0" }
nextBigDecimal = { args = ":0" }
readLine = { args = ":0" }
"System.in.read" = { args = ":0" }

[strings]
nodes = ["string_literal", "character_literal", "text_block"]
concat_operator = "+"
