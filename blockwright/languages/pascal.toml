# Pascal (Turbo / Free Pascal / Delphi). Keywords are named nodes in this
# grammar (kBegin, kEnd, …), so skip_pattern hides them.

name = "pascal"
title = "Pascal"
grammar = "tree_sitter_pascal"
package = "tree-sitter-pascal"
# The grammar is AGPL-3.0, so it is not shipped in vendor/ or the binaries:
# `pip install tree-sitter-pascal` once to enable Pascal.
bundle = false
extensions = [".pas", ".pp", ".dpr", ".lpr"]
markers = ["begin", "end."]
case_sensitive = false
separators = ["."]
assign = ":="
skip = ["comment"]
skip_pattern = "^k[A-Z]"
# statements written as plain identifiers
words = { break = ["break"], continue = ["continue"], return = ["exit", "halt"] }

[functions]
nodes = ["defProc"]
name = "header.name"
parameters = "header.args"
parameter_nodes = ["declArg"]
signature = "header"
names = ["identifier", "genericDot"]
entry = []
# local procedures get charts of their own
nested = true

# the main `begin … end.`, with or without a `program Name;` header
[program]
node = "root"
body = ["block", "program.block"]
name = "program.moduleName"

[statements]
block = "block"
statements = "block"
statement = "expression"
if = { kind = "if", condition = "condition", then = "then", else = "else" }
ifElse = { kind = "if", condition = "condition", then = "then", else = "else" }
while = { kind = "while", condition = "condition", body = "body" }
repeat = { kind = "do", condition = "condition", body = "body", until = true }
for = { kind = "counting", var = "start.lhs", start = "start.rhs", end = "end", descending = "kDownto", body = "body" }
foreach = { kind = "foreach", var = "iterator", iterable = "iterable", body = "body" }
case = { kind = "switch", value = "#0", default_after = "kElse", cases = { caseCase = { value = "label", body = "body" } } }
try = { kind = "try", body = "try", handlers = { exceptionHandler = { parameter = "exception", body = "body" } }, catch_all = "except", finally = "finally" }
raise = "throw"
with = { kind = "inline", body = "body" }

[calls]
nodes = { exprCall = "args" }
callee = "entity"

[io]
# writeln(x:8:2): the width and precision are not printed text
skip_args = ["legacyFormat"]

[io.output]
write = { weave = ":" }
writeln = { weave = ":" }

[io.input]
read = {}
readln = {}

[strings]
nodes = ["literalString"]
escape = "double"
